services:
  api-gateway:
    build:
      context: ../backend/api-gateway
    environment:
      METADATA_SERVICE_URL: http://metadata-provenance:8001
      MODEL_FINGERPRINT_SERVICE_URL: http://model-fingerprint:8002
      ENGINE_TIMEOUT_SECONDS: 30
      IMFORENSIC_DB_PATH: /app/data/imforensic.sqlite3
      IMFORENSIC_UPLOAD_DIR: /app/data/uploads
      MAX_UPLOAD_MB: 20
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    volumes:
      - imforensic_data:/app/data
    depends_on:
      metadata-provenance:
        condition: service_healthy
      model-fingerprint:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  metadata-provenance:
    build:
      context: ../backend/services/metadata-provenance
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  model-fingerprint:
    build:
      context: ../backend/services/model-fingerprint
    ports:
      - "8002:8002"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/ready')"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  pixel-forensics:
    build:
      context: ../backend/services/pixel-forensics
    ports:
      - "8003:8003"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/ready')"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  ai-content-detection:
    build:
      context: ../backend/services/ai-content-detection
      args:
        ENABLE_DDA: ${ENABLE_DDA:-false}
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}
    environment:
      DDA_CHECKPOINT_PATH: /models/DDA_ckpt.pth
      DDA_CHECKPOINT_SHA256: ${DDA_CHECKPOINT_SHA256:-b27a31d39374803ddeff02bfabb2be76e190b04300490cddfafb24f683f37e3e}
      DDA_DEVICE: ${DDA_DEVICE:-auto}
    volumes:
      - ${DDA_MODEL_DIR:-../models}:/models:ro
      - dda_torch_cache:/root/.cache/torch
    ports:
      - "8004:8004"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8004/health')"]
      interval: 20s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.9.1
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: imforensic
      POSTGRES_USER: imforensic
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
  imforensic_data:
  dda_torch_cache:
